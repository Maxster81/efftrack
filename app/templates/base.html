<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
</head>
<body>
  <header class="app-header" role="banner">
    <div class="app-header__inner">
      <h1 class="app-header__title">{{ app_name }}</h1>
      <div class="app-header__actions">
        <span class="app-header__phase" aria-label="Fase corrente">{{ phase }}</span>
        <button type="button" class="app-header__user" aria-label="Utente (futuro login)" title="Utente">
          <svg class="app-header__user-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8" r="4" fill="currentColor" />
            <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" fill="none" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main" role="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer" role="contentinfo">
    <small>{{ app_name }} &middot; v{{ app_version }}</small>
  </footer>
</body>
</html>
